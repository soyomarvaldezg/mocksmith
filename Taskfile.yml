version: '3'

vars:
  BINARY_NAME: mocksmith
  BUILD_DIR: build

tasks:
  default:
    desc: Build the application
    cmds:
      - task: build

  build:
    desc: Build for current OS
    cmds:
      - mkdir -p {{.BUILD_DIR}}
      - go build -o {{.BUILD_DIR}}/{{.BINARY_NAME}} .

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf {{.BUILD_DIR}}

  install:
    desc: Install binary to $GOPATH/bin
    cmds:
      - go install .

  test:
    desc: Run all tests
    cmds:
      - go test ./...

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  run:
    desc: Run the application
    cmds:
      - go run .
