version: 2

project_name: mocksmith

before:
  hooks:
    - go mod tidy

builds:
  - id: mocksmith
    main: .
    binary: mocksmith
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/soyomarvaldezg/mocksmith/cmd.version={{ .Version }}
      - -X github.com/soyomarvaldezg/mocksmith/cmd.commit={{ .Commit }}
      - -X github.com/soyomarvaldezg/mocksmith/cmd.date={{ .Date }}

archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md

checksum:
  name_template: checksums.txt

release:
  prerelease: auto
