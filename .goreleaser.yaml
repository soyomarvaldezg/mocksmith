version: 2

project_name: mocksmith

before:
  hooks:
    - go mod tidy

builds:
  - id: mocksmith
    main: .
    binary: mocksmith
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/soyomarvaldezg/mocksmith/cmd.version={{ .Version }}
      - -X github.com/soyomarvaldezg/mocksmith/cmd.commit={{ .Commit }}
      - -X github.com/soyomarvaldezg/mocksmith/cmd.date={{ .Date }}

archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^chore"
      - "^ci"
      - "^docs"
      - "^build"
      - "^test"

homebrew_casks:
  - name: mocksmith
    repository:
      owner: soyomarvaldezg
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: https://github.com/soyomarvaldezg/mocksmith
    description: Generate realistic fake data for testing, demos, and data engineering pipelines.
    license: MIT
    binaries:
      - mocksmith

scoops:
  - name: mocksmith
    repository:
      owner: soyomarvaldezg
      name: scoop-bucket
      token: "{{ .Env.SCOOP_BUCKET_GITHUB_TOKEN }}"
    homepage: https://github.com/soyomarvaldezg/mocksmith
    description: Generate realistic fake data for testing, demos, and data engineering pipelines.
    license: MIT

release:
  prerelease: auto
